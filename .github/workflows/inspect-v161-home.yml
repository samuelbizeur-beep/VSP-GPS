name: Inspect V161 home UI
on:
  push:
    branches: [v151-build]
    paths: ['.github/workflows/inspect-v161-home.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          repairs=[('00','insert',4376,'P'),('08','insert',7827,'F'),('09','replace',9116,'I')]
          pieces=[]
          for i in range(15):
              n=f'{i:02d}'; s=''.join(Path(f'v151_lean/chunk_{n}.b64').read_text().split())
              for rn,mode,pos,ch in repairs:
                  if rn!=n: continue
                  if mode=='insert' and len(s)==13999: s=s[:pos]+ch+s[pos:]
                  elif mode=='replace' and len(s)==14000 and n=='09': s=s[:pos]+ch+s[pos+1:]
              pieces.append(s)
          Path('/tmp/v151.tar.xz').write_bytes(base64.b64decode(''.join(pieces),validate=True))
          PY
          tar -xJf /tmp/v151.tar.xz -C .
      - name: Print home/search sections
        shell: bash
        run: |
          F=app/src/main/java/fr/vspgps/app/MainActivity.kt
          grep -nEi 'WelcomeScreen|Rechercher une adresse|Historique|Favoris|Autour de vous|Mes trajets|Recherche|Search|HomeScreen|Accueil|Domicile|Travail' "$F" | head -220 || true
          for n in $(grep -nEi 'Rechercher une adresse|WelcomeScreen|Historique|Favoris' "$F" | cut -d: -f1 | head -25); do
            a=$((n-35)); [ $a -lt 1 ] && a=1; b=$((n+90)); echo "=== $a-$b ==="; sed -n "${a},${b}p" "$F";
          done
