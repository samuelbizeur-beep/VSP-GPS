name: Inspect V151 roundabout logic

on:
  push:
    branches:
      - v151-build
    paths:
      - '.github/workflows/inspect-v151-roundabout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V151 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          repairs = [('00','insert',4376,'P'), ('08','insert',7827,'F'), ('09','replace',9116,'I')]
          for n, mode, pos, ch in repairs:
              p = Path(f'v151_lean/chunk_{n}.b64')
              s = ''.join(p.read_text().split())
              if mode == 'insert' and len(s) == 13999:
                  s = s[:pos] + ch + s[pos:]
              elif mode == 'replace' and len(s) == 14000:
                  s = s[:pos] + ch + s[pos+1:]
              p.write_text(s)
          raw = base64.b64decode(''.join(''.join(Path(f'v151_lean/chunk_{i:02d}.b64').read_text().split()) for i in range(15)))
          Path('/tmp/v151.tar.xz').write_bytes(raw)
          PY
          tar -xJf /tmp/v151.tar.xz -C .

      - name: Print roundabout counting code
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/fr/vspgps/app/MainActivity.kt
          echo '--- MATCHES ---'
          grep -nEi 'roundabout|rond.point|natif=|calcul=|ring=|service|parking_aisle|driveway|track|candidate|sortie' "$F" | head -350 || true
          echo '--- CONTEXT AROUND CALCUL / RING ---'
          for n in $(grep -nE 'calcul=|ring=' "$F" | cut -d: -f1 | head -20); do
            a=$((n-35)); [ $a -lt 1 ] && a=1; b=$((n+55));
            echo "===== lines $a-$b =====";
            sed -n "${a},${b}p" "$F";
          done
