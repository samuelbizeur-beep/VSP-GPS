name: Export V156 home
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-v156-home.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V151 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          repairs=[('00','insert',4376,'P'),('08','insert',7827,'F'),('09','replace',9116,'I')]
          pieces=[]
          for i in range(15):
              n=f'{i:02d}'
              s=''.join(Path(f'v151_lean/chunk_{n}.b64').read_text().split())
              for rn,mode,pos,ch in repairs:
                  if rn != n: continue
                  if mode=='insert' and len(s)==13999: s=s[:pos]+ch+s[pos:]
                  elif mode=='replace' and len(s)==14000 and n=='09': s=s[:pos]+ch+s[pos+1:]
              pieces.append(s)
          Path('/tmp/v151.tar.xz').write_bytes(base64.b64decode(''.join(pieces),validate=True))
          PY
          tar -xJf /tmp/v151.tar.xz -C .
      - name: Show references
        shell: bash
        run: |
          grep -Rni 'vsp_home' app/src/main/java app/src/main/res || true
          file app/src/main/res/drawable/vsp_home.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: VSP-HOME-CURRENT
          path: app/src/main/res/drawable/vsp_home.png
