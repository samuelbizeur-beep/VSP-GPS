name: Build and publish V151 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v151-build
    paths:
      - 'v151_lean/**'
      - '.github/workflows/v151-build-publish.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V151 branch
        uses: actions/checkout@v4
        with:
          ref: v151-build

      - name: Reconstruct and validate V151 source
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find v151_lean -maxdepth 1 -name 'chunk_*.b64' | wc -l)"
          echo "Chunks: $COUNT"
          test "$COUNT" -eq 15
          cat v151_lean/chunk_*.b64 | tr -d '\r\n\t ' | base64 --decode > /tmp/V151-lean9.tar.xz
          xz -t /tmp/V151-lean9.tar.xz
          tar -tJf /tmp/V151-lean9.tar.xz >/tmp/v151-files.txt
          echo "Archive V151 valide : $(wc -l </tmp/v151-files.txt) entrées"
          tar -xJf /tmp/V151-lean9.tar.xz -C .
          grep -n 'versionCode 151\|versionCode = 151' app/build.gradle.kts
          grep -n '151.0-test' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build V151 debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publish APK to branch
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/VSP-GPS-V151-roundabout-test-stop.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/VSP-GPS-V151-roundabout-test-stop.apk
          if git diff --cached --quiet; then
            echo 'APK already published'
          else
            git commit -m 'Publish V151 test APK'
            git push origin HEAD:v151-build
          fi

      - name: Upload V151 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V151-roundabout-test-stop
          path: dist/VSP-GPS-V151-roundabout-test-stop.apk
          if-no-files-found: error
