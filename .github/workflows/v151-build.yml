              return hashlib.sha256(s.encode('ascii')).hexdigest()

          for n in ('00','08'):
              p = Path(f'v151_lean/chunk_{n}.b64')
              s = ''.join(p.read_text().split())
              if sha(s) == full_hashes[n]:
                  continue
              if len(s) != 13999:
                  raise SystemExit(f'chunk {n}: longueur inattendue {len(s)}')
              first_bad = None
              for k,h in enumerate(block_hashes[n]):
                  if sha(s[k*250:(k+1)*250]) != h:
