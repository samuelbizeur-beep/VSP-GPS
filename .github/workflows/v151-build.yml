name: Build V151 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v151-build
    paths:
      - 'v151_lean/**'
      - '.github/workflows/v151-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V151 branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate V151 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          expected = {
            '00':'5e2b0fd8c9fb07d143c034c28abe819e41e22e4d94188ef9d98fa87f6c5b5c3b',
            '01':'9e6bcff0d2cfb2647c4271c8fc804f43a1e832a27fd872421e287f0224deafa2',
            '02':'a1558666381c7c8de1bbc2dc89e8aa0b48a1ffe2508d2d0dce2e81191bbb6f84',
            '03':'ead48c305d3cd581384ec3ad0bd47c475673e92aca162df37e6865fb90363c38',
            '04':'dae57190d75c67d63792012e3a11f6089ef06d7aa579ee3ad8f73011bc701589',
            '05':'604687af82681e121979e445c056a33127e2e565b09dfbcb1472b8f4961f4b6a',
            '06':'f72b1a35d7fa7796a75333ef223dc73c7622921c530944352f6c7adb88c3c658',
            '07':'02bf283b071d3781a2185f67ef23420332e28795cc6e06f141050fe9d2195485',
            '08':'a861aaa8d0a458d17ec702756ba693d670e1df2594aa7fea62bf026e4570a51c',
            '09':'c25bff024e9ee4060614a81d93199b18d7ccc84498f6b6e345a55afbc62cfe4f',
            '10':'4f6878b74b2d06ed9e1300aa08c63dc50d23740fabc68dd1498a53c21a48d7d9',
            '11':'8d618594c96c5b808379ab8cd7b445634ec0b9b7c858a15bf8693fa563e6413b',
            '12':'0d2fa27218a37079d3ac082e70848cc97db344e0765e78e2a1d9fc5fb7fdbf36',
            '13':'786c51fee6f89bccebfd9f9a0bb7ae54a6bd6c337c121b4911ead3882b9f80d4',
            '14':'4d1d947a0bac06e2cc98941d1785066edf1ceb0af61a9f77ea18cacfac082dc7',
          }
          def sha(s): return hashlib.sha256(s.encode('ascii')).hexdigest()

          repairs = [('00','insert',4376,'P'), ('08','insert',7827,'F'), ('09','replace',9116,'I')]
          for n, mode, pos, ch in repairs:
            p = Path(f'v151_lean/chunk_{n}.b64')
            s = ''.join(p.read_text().split())
            if sha(s) != expected[n]:
              s = s[:pos] + ch + (s[pos:] if mode == 'insert' else s[pos+1:])
              if sha(s) != expected[n]:
                raise SystemExit(f'Réparation du fragment {n} échouée')
              p.write_text(s)
              print(f'fragment {n} réparé')

          pieces = []
          for i in range(15):
            n = f'{i:02d}'
            s = ''.join(Path(f'v151_lean/chunk_{n}.b64').read_text().split())
            got = sha(s)
            if got != expected[n]:
              raise SystemExit(f'fragment {n} invalide: {got}')
            pieces.append(s)

          raw = base64.b64decode(''.join(pieces), validate=True)
          got = hashlib.sha256(raw).hexdigest()
          want = 'c3ebb279385ad13d935eef2201a541a64006edfd949bce0b67bc66f0c4768b19'
          if got != want:
            raise SystemExit(f'archive V151 invalide: {got}')
          Path('/tmp/V151-lean9.tar.xz').write_bytes(raw)
          print('Source V151 intégralement validée')
          PY
          xz -t /tmp/V151-lean9.tar.xz
          tar -xJf /tmp/V151-lean9.tar.xz -C .
          grep -n 'versionCode = 151' app/build.gradle.kts
          grep -n 'versionName = "151.0-test"' app/build.gradle.kts
          test -f app/src/main/res/drawable/vsp_home.png
          sed -i 's/R\.drawable\.vsp_splash/R.drawable.vsp_home/g' app/src/main/java/fr/vspgps/app/MainActivity.kt
          sed -i 's/applicationId = "fr\.vspgps\.app"/applicationId = "fr.vspgps.app.v151test"/' app/build.gradle.kts
          sed -i 's/android:label="VSP GPS"/android:label="VSP GPS V151 TEST"/' app/src/main/AndroidManifest.xml
          grep -n 'applicationId = "fr.vspgps.app.v151test"' app/build.gradle.kts
          grep -n 'VSP GPS V151 TEST' app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-tools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Build V151 debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" VSP-GPS-V151-SIDE-BY-SIDE.apk
          unzip -t VSP-GPS-V151-SIDE-BY-SIDE.apk >/dev/null
          ls -lh VSP-GPS-V151-SIDE-BY-SIDE.apk

      - name: Upload V151 APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V151-SIDE-BY-SIDE
          path: VSP-GPS-V151-SIDE-BY-SIDE.apk
          if-no-files-found: error