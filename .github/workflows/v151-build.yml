name: Build V151 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v151-build
    paths:
      - 'v151_lean/**'
      - '.github/workflows/v151-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V151 branch
        uses: actions/checkout@v4

      - name: Repair and validate V151 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          def sha(s): return hashlib.sha256(s.encode('ascii')).hexdigest()
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          expected = {
            '00':'5e2b0fd8c9fb07d143c034c28abe819e41e22e4d94188ef9d98fa87f6c5b5c3b','01':'9e6bcff0d2cfb2647c4271c8fc804f43a1e832a27fd872421e287f0224deafa2','02':'a1558666381c7c8de1bbc2dc89e8aa0b48a1ffe2508d2d0dce2e81191bbb6f84','03':'ead48c305d3cd581384ec3ad0bd47c475673e92aca162df37e6865fb90363c38','04':'dae57190d75c67d63792012e3a11f6089ef06d7aa579ee3ad8f73011bc701589','05':'604687af82681e121979e445c056a33127e2e565b09dfbcb1472b8f4961f4b6a','06':'f72b1a35d7fa7796a75333ef223dc73c7622921c530944352f6c7adb88c3c658','07':'02bf283b071d3781a2185f67ef23420332e28795cc6e06f141050fe9d2195485','08':'a861aaa8d0a458d17ec702756ba693d670e1df2594aa7fea62bf026e4570a51c','09':'c25bff024e9ee4060614a81d93199b18d7ccc84498f6b6e345a55afbc62cfe4f','10':'4f6878b74b2d06ed9e1300aa08c63dc50d23740fabc68dd1498a53c21a48d7d9','11':'8d618594c96c5b808379ab8cd7b445634ec0b9b7c858a15bf8693fa563e6413b','12':'0d2fa27218a37079d3ac082e70848cc97db344e0765e78e2a1d9fc5fb7fdbf36','13':'786c51fee6f89bccebfd9f9a0bb7ae54a6bd6c337c121b4911ead3882b9f80d4','14':'4d1d947a0bac06e2cc98941d1785066edf1ceb0af61a9f77ea18cacfac082dc7'}

          # Deux caractères manquants déjà identifiés par le contrôle SHA précédent.
          for n,pos,ch in [('00',4376,'P'),('08',7827,'F')]:
              p=Path(f'v151_lean/chunk_{n}.b64'); s=''.join(p.read_text().split())
              if sha(s) != expected[n]:
                  if len(s) != 13999: raise SystemExit(f'chunk {n}: longueur inattendue {len(s)}')
                  s=s[:pos]+ch+s[pos:]
                  if sha(s) != expected[n]: raise SystemExit(f'chunk {n}: réparation SHA échouée')
                  p.write_text(s); print(f'chunk {n} réparé')

          # Fragment 09 : même longueur mais un caractère a été altéré au transfert.
          block09='''330fa873aa1b40df526c66be962fb8961a9b111e3bbf4e8cca46c53b2f57f617,4542fdd463fcbf646e19035535a671254f2b09515f964e64a084cd6fce190cc4,ac901c8e0646ccc5e7ccaecdc4ddc72a7d11402d4b5e98729ad227ee2caf99b5,28c83a0f2a71c9a6f26711a13cd6420193d218d0a2757d07ca1b93f1ed7e62f0,c5b9eec5a90de20adff33b761d9db482f493ce775b47cd9263b8bc06c2208ba7,12ef3105e3e33f2f41d46e223094427fca76766669cb67524979ce63ff1e5208,3ebf42416025728b461474e6e88bda0169ca4f33ca00c07208003c6d3bab25e3,2c58c23b969ce6ea67dbccdfc3022e350a2d4eb272e49873dcf57a4ab07e633f,cb2e404bd1b5344dccb26ca66256cc423d9da91ad45d7040416b071c7491590b,58efe18021fa3c0a53722a69086555a03c1a3909067132408d9527f566046cef,44dc962dad3918ad2a33d55bc5cf66de59192734ae9e9ded0e55aa6923cf9543,cc13877a29be448475755927c0ef2238258db00ce7e2058ebd873872ebe4db69,0c2f8119dbe95e5947e39f05c082ee5d1b379f932e0feb62ce4cf86182656f0e,9b50415a91f878a31fc7197f90455ef0353fa1fd80b308bbcbbd7be1708c14b3,9079b44018d717a76b6d5e4f9d52075b793ed0d81d6f83f7c7f6b450b797f8bb,3e14e5e7f15a62af9201e6e4eed0aaa88a414539f87d8704d923a48cf387a2f9,da64cce6a6becffa34e8df3f35bab09616349e06493c6c477a562c6e24b4b65e,27d209bf209133e5f42346e7d2f1aafe3e8a18caed0e689f7c3483a3c2fba8d4,59e8bb845b3b5d424cb7e053739543baaaeec4d7022839ee5899832e6a7fc1f0,b504fbf8ca4f7ff7dd113ea2c8386a9981d406d16484acc5d8b4d94d9f3a7739,a076861d14c0e435f9ce16675e4396eb9e93eba7c99455367d183ae91a991ed7,f55fae1fd2ce416f9cca2cc272d48f04bb13f406f22a9d41318334a0e11336ea,0a9123180fe94eef5e86324bc1cd425000456607879f2408b42d82d297170001,8d19af4e4cce9da653852d98b25aa6f51930fb2d85236796ab7074841f639dc4,e81599cd905e7efe177b64898429c08e460eec1a47e8289a5649919018f3a16c,75c99749a8df0c17c8a64aa6312e903fb4978bcadf05290f495e0a7a4109d3be,e646fce3711166ecc4da836baaa8bc22e039f13ba6af9e7069f4325eb8a8649b,d7531dece41bb5498632c29ad6028a89399aa0e041be4421b8b52c137c10a428,a4f45d06384710e0f4b6b1c9a4ecce8e82858032815007403d024aff47eb2d8f,e8195019cd55af012be49cda588c8a8a26a23f899c981d1932388b506512ef28,6857ad96b317cfee07274d895a325caa5615e992d6e3d64d18e78ae9601629fe,0f966b0d5bb7752b429f7047052ef8960bad64eb9f3a9627f6499468233303c0,98e05d2f63db53946158079bd16b9f078782a004c0e23e8ae36da0d33793e515,0a958607f3c8fa7e1e8869a5ca2db94f5c60f198e9bc0484ddddcaff88256cdb,2fd0786c4868bd3c4f27d96aa3340a81bd04a344ca9648fb67f76a3000e76e42,4a903f56557237d5fafaaddf3e2ae73f85ef70f3f6f2701199cde0bd148301ba,b88caa892d53d9ea248372285072014b1d19f9761446879c89febc2f47598d8d,b19fccd29e0533cb33a40f46d072e09dbe61a767787896388d071572cf8b99f1,43e00bf5ae9ec03e77739f90dcf7933e3205b29be6431b915519b1844488e174,50b6356081f3b00e543a8faa82dae2d2cbdccee243c9bc90fe3d41cab65b6131,ccad83522a173adf69a230a3a447990fc0cd5a02294af92b1c3c777b432ff2b2,64ee2e41788d77c716276e0184d0045c9c355448364d9f7eed25a86e556bf6f9,0247ff0ff774e12762abd03c86374e797dc2fbcd72cdb900ab78561a306a5eb9,ad1a6e3ce18c1b43710e820b27fd03f340d9664184110bc8f636a5ccf3575b57,5f801692e94da245c84f124710b17a841e951099acaa510295408f627322937e,c90f48e83e64c83d82ff754a90c12ce84d8d8778b7753e3567a4b0712adea23e,bd5273ebbe9371f09085905f96abfc4dc2c8598f7489eb12c14e8957a736c81b,98380e687e4ca2f40dc75157992ad8aba05a8bf239a67980c2b9f322bfd65b88,977c366f7f7689239512d1ed22f73304b7b775c693cedbfbfc0c9be90b97783b,09e17a2e91b2bbc813a7710b65823393ecaf188a6150c4c9ddf59bf7e655e1a3,7d9b96a7b3ee758072b3e81b6bec5d51bffcf71b7222c4829b2a0cc4c432c943,7387f3d9c3cd6cb2407f0c23424b4751c165f39c26a01275f85d42d7a39c5f00,80ad6c75c645814e508001695ff80bb3f9d49e92e5e5b29a9c0e3ec7fdd81aeb,e713eb2dd0888ed9be2a5a1f899c7a0830a871a88188ede0b95e3b4b548305c3,017fcdb2abc4dad0d65d6b3033146042706a99b92218866b65e5233c5c614013,267a3fbde2f3bf20b4d4e6b716836b01f57366475108d71c7b7f5782fa7eb6bb'''.split(',')
          p=Path('v151_lean/chunk_09.b64'); s=''.join(p.read_text().split())
          if sha(s) != expected['09']:
              if len(s) != 14000: raise SystemExit(f'chunk 09 longueur {len(s)}')
              bad=next((k for k,h in enumerate(block09) if sha(s[k*250:(k+1)*250]) != h),None)
              if bad is None: raise SystemExit('chunk 09 bloc fautif introuvable')
              lo=bad*250; hi=min(len(s)-1,lo+249); found=None
              for pos in range(lo,hi+1):
                  original=s[pos]
                  for ch in alphabet:
                      if ch == original: continue
                      cand=s[:pos]+ch+s[pos+1:]
                      if sha(cand) == expected['09']:
                          found=cand; print(f"chunk 09 réparé: {original!r}->{ch!r} position {pos}"); break
                  if found: break
              if not found: raise SystemExit('chunk 09 réparation impossible')
              p.write_text(found)

          pieces=[]
          for i in range(15):
              n=f'{i:02d}'; s=''.join(Path(f'v151_lean/chunk_{n}.b64').read_text().split())
              if sha(s) != expected[n]: raise SystemExit(f'chunk {n} SHA invalide {sha(s)}')
              pieces.append(s)
          raw=base64.b64decode(''.join(pieces),validate=True)
          archive_sha=hashlib.sha256(raw).hexdigest()
          if archive_sha!='c3ebb279385ad13d935eef2201a541a64006edfd949bce0b67bc66f0c4768b19': raise SystemExit(f'archive SHA invalide {archive_sha}')
          Path('/tmp/V151-lean9.tar.xz').write_bytes(raw)
          print('Source V151 intégralement validée')
          PY
          xz -t /tmp/V151-lean9.tar.xz
          tar -xJf /tmp/V151-lean9.tar.xz -C .
          grep -n 'versionCode 151\|versionCode = 151' app/build.gradle.kts
          grep -n '151.0-test' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build V151 debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" VSP-GPS-V151-roundabout-test-stop.apk
          ls -lh VSP-GPS-V151-roundabout-test-stop.apk

      - name: Upload V151 APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V151-roundabout-test-stop
          path: VSP-GPS-V151-roundabout-test-stop.apk
          if-no-files-found: error
