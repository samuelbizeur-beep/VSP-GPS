          def repair_one(n, target_len):
              p=Path(f'v151_lean/chunk_{n}.b64'); s=''.join(p.read_text().split())
              if sha(s)==expected[n]: return
              hs=blocks[n]
              bad=next((k for k,h in enumerate(hs) if sha(s[k*250:min(len(s),(k+1)*250)]) != h),None)
              if bad is None: raise SystemExit(f'chunk {n}: bloc fautif introuvable')
              lo=bad*250; hi=min(len(s),lo+250)
              found=None
              if len(s)==target_len:
                  for pos in range(lo,min(hi,len(s))):
                      orig=s[pos]
                      for ch in alphabet:
                          if ch==orig: continue
                          cand=s[:pos]+ch+s[pos+1:]
                          if sha(cand)==expected[n]: found=cand; print(f'chunk {n}: {orig}->{ch} @ {pos}'); break
                      if found: break
              elif len(s)==target_len-1:
                  for pos in range(lo,hi+1):
                      for ch in alphabet:
                          cand=s[:pos]+ch+s[pos:]
                          if sha(cand)==expected[n]: found=cand; print(f'chunk {n}: insertion {ch} @ {pos}'); break
                      if found: break
              else: raise SystemExit(f'chunk {n}: longueur inattendue {len(s)}')
              if not found: raise SystemExit(f'chunk {n}: réparation impossible')
              p.write_text(found)

