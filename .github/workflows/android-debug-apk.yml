name: Build Android APK V135 CI

on:
  workflow_dispatch:
  push:
    branches:
      - vsp-v135-poi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Apply V135 POI patch
        run: python3 tools/patch_v135.py

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 36 packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Build VSP GPS APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V135-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
