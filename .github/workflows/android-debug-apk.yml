name: Build Android APK V149 roundabout diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - vsp-v149-roundabout-diagnostic

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Check restoration package
        run: test -f V141.zip

      - name: Restore advanced VSP GPS source
        run: unzip -o V141.zip -d .

      - name: Apply V142 restore/version patch
        run: python3 tools/patch_v142_restore.py

      - name: Apply V143 safe comparison patch
        run: python3 tools/patch_v143_safe_comparison.py

      - name: Apply V144 roundabout service exit patch
        run: python3 tools/patch_v144_roundabout_service_exits.py

      - name: Apply V145 drivable exit without roadclass patch
        run: python3 tools/patch_v145_roundabout_missing_roadclass.py

      - name: Apply V146 hybrid OSM and IGN validation patch
        run: python3 tools/patch_v146_roundabout_physical_exits.py

      - name: Apply V147 paired roundabout propagation patch
        run: python3 tools/patch_v147_roundabout_pair_propagation.py

      - name: Apply V148 near-geometry roundabout patch
        run: python3 tools/patch_v148_roundabout_near_geometry.py

      - name: Apply V149 roundabout diagnostic patch
        run: python3 tools/patch_v149_roundabout_diagnostic.py

      - name: Verify V149 diagnostic anchors
        run: |
          grep -n "DIAG RONDS-POINTS V149" app/src/main/java/fr/vspgps/app/MainActivity.kt
          grep -n "nearbyWaysV149" app/src/main/java/fr/vspgps/app/MainActivity.kt
          grep -n 'versionCode = 149' app/build.gradle.kts

      - name: Check signing secrets
        env:
          VSP_KEYSTORE_B64: ${{ secrets.VSP_KEYSTORE_B64 }}
          VSP_KEYSTORE_PASSWORD: ${{ secrets.VSP_KEYSTORE_PASSWORD }}
        run: |
          test -n "$VSP_KEYSTORE_B64"
          test -n "$VSP_KEYSTORE_PASSWORD"

      - name: Restore permanent signing key
        env:
          VSP_KEYSTORE_B64: ${{ secrets.VSP_KEYSTORE_B64 }}
          VSP_KEYSTORE_PASSWORD_SECRET: ${{ secrets.VSP_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/vsp-gps-update.jks"
          printf '%s' "$VSP_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          echo "VSP_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "VSP_KEYSTORE_PASSWORD=$VSP_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 36 packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build signed VSP GPS V149 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK certificate
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V149-roundabout-diagnostic
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
