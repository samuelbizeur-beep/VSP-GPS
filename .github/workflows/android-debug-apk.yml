name: Build Android APK V141 full restore

on:
  workflow_dispatch:
  push:
    branches:
      - vsp-v141-full-restore

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Check restoration package
        run: test -f V141.zip || (echo "Missing V141.zip" && exit 1)

      - name: Restore advanced VSP GPS source
        run: unzip -o V141.zip -d .

      - name: Patch V141 version and permanent signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace('versionCode = 1', 'versionCode = 141', 1)
          text = text.replace('versionName = "200.0-alpha"', 'versionName = "V141"', 1)
          anchor = '''    buildFeatures {
              compose = true
              buildConfig = true
          }
          '''
          signing = '''    signingConfigs {
              create("vspUpdate") {
                  val keyStorePath = System.getenv("VSP_KEYSTORE_PATH")
                      ?: error("VSP_KEYSTORE_PATH missing")
                  val signingPassword = System.getenv("VSP_KEYSTORE_PASSWORD")
                      ?: error("VSP_KEYSTORE_PASSWORD missing")
                  storeFile = file(keyStorePath)
                  storePassword = signingPassword
                  keyAlias = "vspgps"
                  keyPassword = signingPassword
              }
          }

          buildTypes {
              getByName("debug") {
                  signingConfig = signingConfigs.getByName("vspUpdate")
              }
          }

          ''' + anchor
          if anchor not in text:
              raise SystemExit('buildFeatures anchor not found')
          text = text.replace(anchor, signing, 1)
          gradle.write_text(text, encoding='utf-8')

          router = Path('app/src/main/java/fr/vspgps/app/LocalValhallaRouter.kt')
          r = router.read_text(encoding='utf-8')
          old = '''        appContext.assets.open(TILE_ARCHIVE_NAME).use { input ->

            FileOutputStream(bundledTileArchive).use { output ->
'''
          new = '''        val bundledAssets = appContext.assets.list("")?.toSet().orEmpty()
        if (TILE_ARCHIVE_NAME !in bundledAssets) {
            return
        }

        appContext.assets.open(TILE_ARCHIVE_NAME).use { input ->

            FileOutputStream(bundledTileArchive).use { output ->
'''
          if old not in r:
              raise SystemExit('asset-open anchor not found')
          r = r.replace(old, new, 1)
          old2 = '''            val archive = selectedTileArchive()
            val config =
'''
          new2 = '''            val archive = selectedTileArchive()
            if (!archive.isFile || archive.length() <= 0L) {
                return InitializationResult.Failed(
                    message = "Pack Valhalla absent : importez un pack régional ou France",
                    cause = null
                )
            }
            val config =
'''
          if old2 not in r:
              raise SystemExit('archive anchor not found')
          r = r.replace(old2, new2, 1)
          router.write_text(r, encoding='utf-8')

          main = Path('app/src/main/java/fr/vspgps/app/MainActivity.kt')
          m = main.read_text(encoding='utf-8')
          old3 = '''    when (screen) {
        "splash" -> WelcomeScreen(onFinished = { screen = "energy" })
        "energy" -> EnergyChoiceScreen { choice ->
            energyType = choice
            screen = "gps"
        }
        else -> MapSearchScreen(
            vehicle = vehicle,
            energyType = energyType ?: EnergyType.ELECTRIC,
            onBack = {
                clearStoredActiveTrip(appContext)
                screen = "energy"
            }
        )
    }
'''
          new3 = '''    Box(Modifier.fillMaxSize()) {
        when (screen) {
            "splash" -> WelcomeScreen(onFinished = { screen = "energy" })
            "energy" -> EnergyChoiceScreen { choice ->
                energyType = choice
                screen = "gps"
            }
            else -> MapSearchScreen(
                vehicle = vehicle,
                energyType = energyType ?: EnergyType.ELECTRIC,
                onBack = {
                    clearStoredActiveTrip(appContext)
                    screen = "energy"
                }
            )
        }
        if (screen != "splash") {
            Text(
                text = "V141",
                color = Color(0xFF58A6FF),
                fontSize = 14.sp,
                fontWeight = FontWeight.Bold,
                modifier = Modifier.align(Alignment.TopEnd).padding(top = 10.dp, end = 14.dp)
            )
        }
    }
'''
          if old3 not in m:
              raise SystemExit('VspGpsApp screen anchor not found')
          m = m.replace(old3, new3, 1)
          main.write_text(m, encoding='utf-8')
          print('V141 restore patch applied')
          PY

      - name: Check signing secrets
        env:
          VSP_KEYSTORE_B64: ${{ secrets.VSP_KEYSTORE_B64 }}
          VSP_KEYSTORE_PASSWORD: ${{ secrets.VSP_KEYSTORE_PASSWORD }}
        run: |
          test -n "$VSP_KEYSTORE_B64" || (echo "Missing VSP_KEYSTORE_B64" && exit 1)
          test -n "$VSP_KEYSTORE_PASSWORD" || (echo "Missing VSP_KEYSTORE_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          VSP_KEYSTORE_B64: ${{ secrets.VSP_KEYSTORE_B64 }}
          VSP_KEYSTORE_PASSWORD_SECRET: ${{ secrets.VSP_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/vsp-gps-update.jks"
          printf '%s' "$VSP_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          echo "VSP_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "VSP_KEYSTORE_PASSWORD=$VSP_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 36 packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Build signed VSP GPS V141 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK certificate
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V141-full-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
