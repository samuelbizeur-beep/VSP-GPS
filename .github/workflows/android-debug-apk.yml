name: Build Android APK V141 full restore

on:
  workflow_dispatch:
  push:
    branches:
      - vsp-v141-full-restore

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Check restoration package
        run: test -f VSP-GPS-V141-source-patch.zip || (echo "Missing VSP-GPS-V141-source-patch.zip" && exit 1)

      - name: Restore advanced VSP GPS source
        run: unzip -o VSP-GPS-V141-source-patch.zip -d .

      - name: Check signing secrets
        env:
          VSP_KEYSTORE_B64: ${{ secrets.VSP_KEYSTORE_B64 }}
          VSP_KEYSTORE_PASSWORD: ${{ secrets.VSP_KEYSTORE_PASSWORD }}
        run: |
          test -n "$VSP_KEYSTORE_B64" || (echo "Missing VSP_KEYSTORE_B64" && exit 1)
          test -n "$VSP_KEYSTORE_PASSWORD" || (echo "Missing VSP_KEYSTORE_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          VSP_KEYSTORE_B64: ${{ secrets.VSP_KEYSTORE_B64 }}
          VSP_KEYSTORE_PASSWORD_SECRET: ${{ secrets.VSP_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/vsp-gps-update.jks"
          printf '%s' "$VSP_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          echo "VSP_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "VSP_KEYSTORE_PASSWORD=$VSP_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android 36 packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Build signed VSP GPS V141 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK certificate
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: VSP-GPS-V141-full-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
