name: Inspect V156 destination
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-v156-destination.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V151 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          repairs=[('00','insert',4376,'P'),('08','insert',7827,'F'),('09','replace',9116,'I')]
          pieces=[]
          for i in range(15):
              n=f'{i:02d}'; s=''.join(Path(f'v151_lean/chunk_{n}.b64').read_text().split())
              for rn,mode,pos,ch in repairs:
                  if rn != n: continue
                  if mode=='insert' and len(s)==13999: s=s[:pos]+ch+s[pos:]
                  elif mode=='replace' and len(s)==14000 and n=='09': s=s[:pos]+ch+s[pos+1:]
              pieces.append(s)
          Path('/tmp/v151.tar.xz').write_bytes(base64.b64decode(''.join(pieces),validate=True))
          PY
          tar -xJf /tmp/v151.tar.xz -C .
      - name: Print destination and simulation stop logic
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/java/fr/vspgps/app/MainActivity.kt
          grep -nEi 'simulationActive|simulationRouteSegment|simulation.*stop|stop.*simulation|destination.*reach|arriv|distance.*destination|remaining.*distance|route\.points\.last|lastIndex|simulationSpeed|x16' "$F" | head -1000 || true
          echo '=== focused contexts ==='
          for n in $(grep -nEi 'simulationRouteSegment|destination.*reach|arriv|route\.points\.last|stop.*simulation' "$F" | cut -d: -f1 | head -80); do
            a=$((n-25)); [ $a -lt 1 ] && a=1; b=$((n+45));
            echo "--- $a-$b ---"; sed -n "${a},${b}p" "$F";
          done
